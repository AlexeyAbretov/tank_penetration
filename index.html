<!doctype html>
<!-- Язык страницы — русский: браузер и скринридеры ориентируются на него. -->
<html lang="ru">
  <head>
    <!-- Кодировка UTF-8, чтобы кириллица в игре отображалась правильно. -->
    <meta charset="UTF-8" />
    <!-- На телефоне ширина страницы равна ширине экрана, без уменьшения «как на десктопе». -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Цвет панели браузера. Тот же цвет стоит в манифесте установленного приложения. -->
    <meta name="theme-color" content="#090505" />
    <!-- Установленное приложение открывается без адресной строки. iOS читает apple-префикс. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Tank Penetration" />
    <!-- Текст вкладки браузера. -->
    <title>Tank Penetration</title>
    <style>
      /* Страница на весь экран, без белых полей браузера. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        /* На телефоне высота — видимая область, без полосы под адресной строкой. */
        height: 100dvh;
        /* Почти чёрный фон вокруг холста, если игра не занимает всё окно. */
        background: #090505;
        /* Надписи вне холста: поле числа в дебаге. Холст Phaser этот шрифт не берёт.
           Сам файл шрифта подключает gameFont.ts до старта игры. */
        font-family: "Russo One", Impact, sans-serif;
        /* Страница не скроллится: игра на весь экран. */
        overflow: hidden;
      }

      /* Контейнер, внутрь которого Phaser вставит <canvas>. */
      /* Центр холста ставит сам Phaser. Flex здесь сдвигал бы его ещё раз вправо. */
      /* z-index ниже полосы: холст с transform иначе рисуется поверх неё. */
      #game {
        position: relative;
        z-index: 0;
        width: 100%;
        height: 100%;
      }

      /* Холст Phaser — блочный элемент, чтобы под ним не появлялся лишний зазор. */
      canvas {
        display: block;
      }

      input,
      button,
      textarea {
        font-family: inherit;
      }

      /* Полоса до первого кадра. Её рисует страница, а не холст: скрипт ещё не приехал. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #090505;
        transition: opacity 0.22s ease;
      }

      #boot.is-done {
        opacity: 0;
        pointer-events: none;
      }

      .boot-plate {
        box-sizing: border-box;
        width: min(460px, calc(100% - 24px));
        padding: 22px 16px 18px;
        background: #242c1c;
        border: 8px solid #5a6844;
      }

      .boot-title {
        margin: 0;
        color: #f3d56a;
        font-size: clamp(15px, 4.6vw, 28px);
        letter-spacing: 0.08em;
        text-align: center;
        white-space: nowrap;
      }

      .boot-label {
        margin: 16px 0 12px;
        color: #e6d7a8;
        font-size: 13px;
        letter-spacing: 0.16em;
        text-align: center;
        text-transform: uppercase;
      }

      .boot-track {
        height: 12px;
        overflow: hidden;
        background: #090505;
        border: 2px solid #c4a15a;
      }

      .boot-fill {
        width: 40%;
        height: 100%;
        background: #f3d56a;
        animation: boot-slide 1.2s ease-in-out infinite;
      }

      /* Процент известен: полоса стоит на доле, а не едет сама. */
      #boot-track.is-known .boot-fill {
        animation: none;
        transform: none;
      }

      @keyframes boot-slide {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(280%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }

        .boot-fill {
          width: 100%;
          opacity: 0.35;
          animation: none;
          transform: none;
        }

        #boot-track.is-known .boot-fill {
          opacity: 1;
        }
      }
    </style>
  </head>
  <!-- oncontextmenu: запасной запрет меню по правому клику, если клик пришёл мимо холста. -->
  <body oncontextmenu="return false;">
    <!-- Пустой div. main.ts говорит Phaser: parent: 'game' — рисуй сюда. -->
    <div id="game"></div>
    <!-- Полоса загрузки. Стоит в HTML, а не на холсте: до скрипта и шрифта страница иначе чёрная. -->
    <div id="boot">
      <div class="boot-plate">
        <p class="boot-title">TANK PENETRATION</p>
        <p id="boot-label" class="boot-label">Загрузка</p>
        <div
          id="boot-track"
          class="boot-track"
          role="progressbar"
          aria-label="Загрузка"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          <div id="boot-fill" class="boot-fill"></div>
        </div>
      </div>
    </div>
    <!-- type="module": браузер грузит TypeScript/JS как модуль. Vite подменяет этот путь при разработке. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
