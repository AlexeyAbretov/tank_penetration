<!doctype html>
<!-- Язык страницы — русский: браузер и скринридеры ориентируются на него. -->
<html lang="ru">
  <head>
    <!-- Кодировка UTF-8, чтобы кириллица в игре отображалась правильно. -->
    <meta charset="UTF-8" />
    <!-- На телефоне ширина страницы равна ширине экрана, без уменьшения «как на десктопе». -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Текст вкладки браузера. -->
    <title>Tank Penetration</title>
    <!-- Заранее устанавливаем соединение со шрифтовым сервером Google, чтобы шрифт приехал быстрее. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Russo One — военный шрифт с кириллицей. Им пишутся все надписи игры. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Russo+One&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Страница на весь экран, без белых полей браузера. */
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        /* На телефоне высота — видимая область, без полосы под адресной строкой. */
        height: 100dvh;
        /* Почти чёрный фон вокруг холста, если игра не занимает всё окно. */
        background: #090505;
        /* Надписи вне холста: поле числа в дебаге. Холст Phaser этот шрифт не берёт. */
        font-family: "Russo One", Impact, sans-serif;
        /* Страница не скроллится: игра на весь экран. */
        overflow: hidden;
      }

      /* Контейнер, внутрь которого Phaser вставит <canvas>. */
      /* Центр холста ставит сам Phaser. Flex здесь сдвигал бы его ещё раз вправо. */
      #game {
        width: 100%;
        height: 100%;
      }

      /* Холст Phaser — блочный элемент, чтобы под ним не появлялся лишний зазор. */
      canvas {
        display: block;
      }

      input,
      button,
      textarea {
        font-family: inherit;
      }
    </style>
  </head>
  <!-- oncontextmenu: запасной запрет меню по правому клику, если клик пришёл мимо холста. -->
  <body oncontextmenu="return false;">
    <!-- Пустой div. main.ts говорит Phaser: parent: 'game' — рисуй сюда. -->
    <div id="game"></div>
    <!-- type="module": браузер грузит TypeScript/JS как модуль. Vite подменяет этот путь при разработке. -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
