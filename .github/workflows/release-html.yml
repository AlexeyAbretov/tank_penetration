# Публикация релиза собирает два HTML и прикрепляет их к этому же релизу.
# Черновик сборку не запускает: событие published приходит, когда релиз уже открыт для скачивания.
# Сначала обычный файл: его сборка очищает release/. Подарочная дописывает второй файл рядом.

name: Release HTML

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:html

      - run: npm run build:html:gift

      - name: Attach HTML files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" release/tank-penetration.html release/tank-penetration-gift.html --clobber
