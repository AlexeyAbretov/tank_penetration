# Публикация игры на GitHub Pages. Событие — push в ветку release/release-…
# Собирается обычный dist/: страница, картинки, звук, манифест и service worker.
# Однофайловый HTML этот процесс не трогает: его по-прежнему прикладывает релиз.
# В настройках репозитория источник Pages — GitHub Actions, иначе workflow не выкладывает сайт.

name: GitHub Pages

on:
  push:
    branches:
      - 'release/release-**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
